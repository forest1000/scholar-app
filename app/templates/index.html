{% extends "base.html" %}

{% block content %}
<div id="app">
    <div class="hero" style="text-align: center; padding: 4rem 0;">
        <h1 style="font-size: 3rem; margin-bottom: 1rem;">学術論文検索・分析システム</h1>
        <p style="font-size: 1.2rem; color: #6e6e73; margin-bottom: 2rem;">
            Arxivの論文をAIで高度に検索・分析
        </p>
        <a href="{{ url_for('main.search_page') }}" class="btn btn-primary">検索を開始</a>
    </div>
    
    <div class="features" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; margin-top: 4rem;">
        <div class="card">
            <h3 style="margin-bottom: 1rem;">🔍 高度な検索機能</h3>
            <p>キーワード、著者名、出版年などで詳細な検索が可能。複数条件での絞り込みにも対応。</p>
        </div>

        <div class="card">
            <h3 style="margin-bottom: 1rem;">🤖 AI特徴量検索</h3>
            <p>「〇〇の新しい解決策を提案している論文」など、自然言語での高度な検索が可能。</p>
        </div>
        
    </div>
    
</div>
{% endblock %}


{% block scripts %}
    {{ super() }}
    <script src="{{ url_for('static', filename='js/index.js') }}" defer></script>
{% endblock %}
